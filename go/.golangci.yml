version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - gocritic
    - lll
  settings:
    lll:
      line-length: 100
      tab-width: 4
    revive:
      rules:
        - name: exported
        - name: unused-parameter
          disabled: true
formatters:
  enable: [gofmt, goimports]
