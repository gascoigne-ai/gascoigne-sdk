version: 2
updates:
  - { package-ecosystem: uv, directory: /python, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /typescript, schedule: { interval: weekly }, ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }] }
  - { package-ecosystem: gomod, directory: /go, schedule: { interval: weekly } }
  - { package-ecosystem: maven, directory: /java, schedule: { interval: weekly } }
  - { package-ecosystem: nuget, directory: /dotnet, schedule: { interval: weekly } }
  - { package-ecosystem: cargo, directory: /rust, schedule: { interval: weekly }, ignore: [{ dependency-name: '*', update-types: ['version-update:semver-major'] }] }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
