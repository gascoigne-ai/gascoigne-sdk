name: release
# Independent versions per ecosystem, chosen by tag prefix:
#   py-v1.2.3  ts-v1.2.3  go/v1.2.3  java-v1.2.3  dotnet-v1.2.3  rust-v1.2.3
#
# Every tag builds its artifacts and attaches them, with checksums, to a GitHub release, and the
# npm, Maven and NuGet ones also go to GitHub Packages. Neither needs a secret beyond the workflow's
# own token. Publishing to the public registries is a further job per ecosystem, switched on by a
# repository variable (PUBLISH_PYPI, PUBLISH_NPM, PUBLISH_NUGET, PUBLISH_CRATES, PUBLISH_MAVEN = true) and by
# the secrets in docs/releasing.md.
on:
  push:
    tags: ["py-v*", "ts-v*", "go/v*", "java-v*", "dotnet-v*", "rust-v*"]
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}
jobs:
  python:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py py "${TAG#py-v}"
      - run: mise run py:check
      - run: cd python/gascoigne && uv build --out-dir ../../dist
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create "$TAG" dist/* --title "Python SDK ${TAG#py-v}" --generate-notes
  publish-pypi:
    needs: python
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: gh release download "$TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - run: uv publish --trusted-publishing always dist/*

  typescript:
    if: startsWith(github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py ts "${TAG#ts-v}"
      - run: mise run ts:check
      - run: cd typescript && pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create "$TAG" dist/* --title "TypeScript SDK ${TAG#ts-v}" --generate-notes
  publish-npm:
    needs: typescript
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: gh release download "$TAG" --dir dist --pattern '*.tgz'
      - run: for f in dist/*.tgz; do npm publish "$f" --access public --provenance; done
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  packages-npm:
    needs: typescript
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://npm.pkg.github.com" }
      - run: gh release download "$TAG" --dir dist --pattern '*.tgz'
      - run: for f in dist/*.tgz; do npm publish "$f"; done
        env: { NODE_AUTH_TOKEN: "${{ github.token }}" }

  go:
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py go "${TAG#go/v}"
      - run: mise run go:check
      # The Go module proxy serves the tag itself; the release only announces it.
      - run: gh release create "$TAG" --title "Go SDK ${TAG#go/v}" --generate-notes

  java:
    if: startsWith(github.ref_name, 'java-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py java "${TAG#java-v}"
      - run: mise run java:check
      - run: mkdir dist && cp java/target/gascoigne-*.jar java/spring-ai/target/gascoigne-spring-ai-*.jar dist/
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create "$TAG" dist/* --title "Java SDK ${TAG#java-v}" --generate-notes
  packages-maven:
    needs: java
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: cd java && mvn -B deploy -DskipTests && cd spring-ai && mvn -B deploy -DskipTests
        env: { GITHUB_ACTOR: "${{ github.actor }}", GITHUB_TOKEN: "${{ github.token }}" }
  # Maven Central needs the central-publishing plugin, signing and a namespace: see docs/releasing.md.
  publish-maven:
    needs: java
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cd java && mvn -B deploy -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  dotnet:
    if: startsWith(github.ref_name, 'dotnet-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py dotnet "${TAG#dotnet-v}"
      - run: mise run dotnet:check
      - run: cd dotnet && dotnet pack src/Gascoigne -c Release -o ../dist && dotnet pack src/Gascoigne.Extensions.AI -c Release -o ../dist
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create "$TAG" dist/* --title ".NET SDK ${TAG#dotnet-v}" --generate-notes
  packages-nuget:
    needs: dotnet
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: gh release download "$TAG" --dir dist --pattern '*.nupkg'
      - run: dotnet nuget push "dist/*.nupkg" --api-key "${{ github.token }}" --source https://nuget.pkg.github.com/gascoigne-ai/index.json
  publish-nuget:
    needs: dotnet
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: gh release download "$TAG" --dir dist --pattern '*.nupkg'
      - run: dotnet nuget push "dist/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  rust:
    if: startsWith(github.ref_name, 'rust-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: python3 scripts/check_version.py rust "${TAG#rust-v}"
      - run: mise run rust:check
      - run: cd rust && cargo package && mkdir -p ../dist && cp target/package/*.crate ../dist/
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create "$TAG" dist/* --title "Rust SDK ${TAG#rust-v}" --generate-notes
  publish-crates:
    needs: rust
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cd rust && cargo publish
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
