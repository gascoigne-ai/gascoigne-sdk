name: release
# Independent versions per ecosystem, selected by tag prefix:
#   py-v1.2.3  ts-v1.2.3  go/v1.2.3  java-v1.2.3  dotnet-v1.2.3  rust-v1.2.3
on:
  push:
    tags: ["py-v*", "ts-v*", "go/v*", "java-v*", "dotnet-v*", "rust-v*"]
permissions: { contents: write, id-token: write, attestations: write }
env: { GH_TOKEN: "${{ github.token }}" }
jobs:
  python:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run py:check
      - run: cd python/gascoigne && uv build && uv publish --trusted-publishing always   # PyPI trusted publishing (OIDC)
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: python/gascoigne/dist/* }
      - run: gh release create "$GITHUB_REF_NAME" python/gascoigne/dist/* --generate-notes

  typescript:
    if: startsWith(github.ref_name, 'ts-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ts:check
      - run: cd typescript && pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", NPM_CONFIG_PROVENANCE: "true" }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes

  go:
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    steps:                      # the Go proxy serves the tag itself; verify, then announce
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run go:check
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes

  java:
    if: startsWith(github.ref_name, 'java-v')
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run java:check
      - run: cd java && mvn -B -q package -DskipTests
      - run: gh release create "$GITHUB_REF_NAME" java/target/*.jar --generate-notes
      # Publishing to Maven Central needs the central-publishing plugin and OSSRH/GPG secrets (see docs/releasing.md).

  dotnet:
    if: startsWith(github.ref_name, 'dotnet-v')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run dotnet:check
      - run: cd dotnet && dotnet pack src/Gascoigne -c Release -o out && dotnet pack src/Gascoigne.Extensions.AI -c Release -o out
      - run: cd dotnet && dotnet nuget push out/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - run: gh release create "$GITHUB_REF_NAME" dotnet/out/*.nupkg --generate-notes

  rust:
    if: startsWith(github.ref_name, 'rust-v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run rust:check
      - run: cd rust && cargo publish
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
