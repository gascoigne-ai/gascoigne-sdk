name: ci
on:
  push: { branches: [master] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]   # weekly: catches drift against the CLI's master
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: gascoigne-ai/gascoigne-cli, path: cli }
      - uses: jdx/mise-action@v2
      - run: cd cli && go build -o ../gascoigne ./cmd/gascoigne
      - run: GASCOIGNE_BIN=$PWD/gascoigne mise run e2e
  demos-dry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [langchain, langgraph, agno, adk, openai-agents, crewai, llamaindex, pydantic-ai, smolagents]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cd demos/python && GASCOIGNE_DEMO_DRY=1 uv run --extra ${{ matrix.demo }} python $(echo ${{ matrix.demo }} | tr - _)_demo.py
