name: ci
on:
  push: { branches: [master] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]   # weekly: catches drift against the CLI's master
permissions: { contents: read }
jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/commit_style.py origin/${{ github.base_ref }}..HEAD
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [style, py:check, ts:check, go:check, java:check, dotnet:check, rust:check]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ${{ matrix.task }}
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: gascoigne-ai/gascoigne-cli, path: cli }
      # The SDKs need the CLI's /sdk/v1 API; until a CLI release has it, say so instead of failing.
      - id: cli
        run: |
          if [ -f cli/cmd/gascoigne/sdk.go ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::gascoigne-cli has no /sdk/v1 API yet; skipping e2e"; fi
      - if: steps.cli.outputs.ready == 'true'
        uses: jdx/mise-action@v2
      - if: steps.cli.outputs.ready == 'true'
        run: cd cli && go build -o ../gascoigne ./cmd/gascoigne
      - if: steps.cli.outputs.ready == 'true'
        run: GASCOIGNE_BIN=$PWD/gascoigne mise run e2e
