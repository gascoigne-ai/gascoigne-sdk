[tools]
uv = "latest"
python = "3.12"
node = "22"
pnpm = "10"
go = "1.27"
java = "temurin-21"
maven = "3"
dotnet = "9"
rust = "stable"

[tasks."py:check"]
description = "Python: lint, tests"
dir = "python"
run = ["uv sync --all-packages", "uv run ruff check .", "uv run ruff format --check .", "uv run pytest -q"]

[tasks."ts:check"]
description = "TypeScript: install, build, typecheck, tests"
dir = "typescript"
run = ["pnpm install --frozen-lockfile", "pnpm -r build", "pnpm check"]

[tasks."go:check"]
description = "Go: vet, tests"
dir = "go"
run = ["go vet ./...", "go test ./...", "go -C demos vet ./..."]

[tasks."java:check"]
description = "Java: tests"
dir = "java"
run = "mvn -q -B test"

[tasks."dotnet:check"]
description = "dotnet: tests"
dir = "dotnet"
run = "dotnet test tests/Gascoigne.Tests"

[tasks."rust:check"]
description = "Rust: fmt, clippy, tests"
dir = "rust"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings", "cargo test"]

[tasks.check]
description = "Everything that must pass before a change is done"
depends = ["py:check", "ts:check", "go:check", "java:check", "dotnet:check", "rust:check"]

[tasks.e2e]
description = "Python tests against a real gascoigne binary (GASCOIGNE_BIN or PATH)"
dir = "python"
run = "uv run pytest -q -m e2e"

[tasks.demo]
description = "Dry-run every demo (no LLM call); needs gascoigne on PATH"
run = "bash scripts/demos.sh"
