[tools]
uv = "latest"
python = "3.12"
node = "22"
pnpm = "10"
go = "1.27"
java = "temurin-21"
maven = "3"
dotnet = "9"
rust = "stable"
golangci-lint = "latest"

[tasks."py:check"]
description = "Python: ruff, pyright (strict), tests"
dir = "python"
run = [
  "uv sync --all-packages",
  "uv run ruff check . ../demos/python",
  "uv run ruff format --check . ../demos/python",
  "uv run pyright",
  "uv run pytest -q",
]

[tasks."ts:check"]
description = "TypeScript: Biome, tsc, tests"
dir = "typescript"
run = ["pnpm install --frozen-lockfile", "pnpm -r build", "pnpm check"]

[tasks."go:check"]
description = "Go: gofmt, golangci-lint, tests"
dir = "go"
run = ["gofmt -l -e . | (! grep .)", "golangci-lint run ./...", "cd demos && golangci-lint run -c ../.golangci.yml ./...", "go test ./..."]

[tasks."java:check"]
description = "Java: compile with -Xlint:all -Werror, tests"
dir = "java"
run = "mvn -q -B test"

[tasks."dotnet:check"]
description = "dotnet: format, analyzers as errors, tests"
dir = "dotnet"
run = ["dotnet format --verify-no-changes src/Gascoigne", "dotnet test tests/Gascoigne.Tests"]

[tasks."rust:check"]
description = "Rust: fmt, clippy (pedantic on the library), tests"
dir = "rust"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo clippy --lib --examples -- -D warnings -W clippy::pedantic",
  "cargo test",
]

[tasks.check]
description = "Everything that must pass before a change is done"
depends = ["py:check", "ts:check", "go:check", "java:check", "dotnet:check", "rust:check"]

[tasks.e2e]
description = "Python tests against a real gascoigne binary (GASCOIGNE_BIN or PATH)"
dir = "python"
run = "uv run pytest -q -m e2e"

[tasks.demo]
description = "Dry-run every demo (no LLM call); needs gascoigne on PATH"
run = "bash scripts/demos.sh"
