[project]
name = "gascoigne-demos"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["gascoigne", "rich>=13", "python-dotenv>=1"]

[project.optional-dependencies]
langchain = ["langchain-openai>=0.3", "langchain-core>=0.3"]
langgraph = ["langgraph>=1.0", "langchain>=1.0", "langchain-openai>=0.3"]
agno = ["agno", "openai"]
adk = ["google-adk", "litellm"]
openai-agents = ["openai-agents"]
crewai = ["crewai>=1.0", "setuptools<81"]
llamaindex = ["llama-index-core", "llama-index-llms-openai-like"]
pydantic-ai = ["pydantic-ai-slim[openai]"]
smolagents = ["smolagents[openai]"]
auto-mcp = ["langchain-mcp-adapters", "langgraph>=1.0", "langchain>=1.0", "langchain-openai>=0.3"]

[tool.uv.sources]
gascoigne = { path = "../../python/gascoigne", editable = true }

[tool.uv]
# One framework per run: their pins conflict (`uv run --extra langgraph ...`).
conflicts = [[
  { extra = "langchain" }, { extra = "langgraph" }, { extra = "agno" }, { extra = "adk" },
  { extra = "openai-agents" }, { extra = "crewai" }, { extra = "llamaindex" },
  { extra = "pydantic-ai" }, { extra = "smolagents" }, { extra = "auto-mcp" },
]]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_kit"]
only-include = ["demo_kit", "demo_logs.py"]
