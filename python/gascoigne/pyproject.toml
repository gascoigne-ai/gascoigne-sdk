[project]
name = "gascoigne"
version = "0.1.1"
description = "Embed gascoigne token optimization in agent frameworks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gascoigne"]
