[project]
name = "gascoigne-native"
version = "0.10.0"
description = "The gascoigne engine as a bundled native library, for the gascoigne SDK's native mode"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["gascoigne>=0.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gascoigne_native"]
# The bundle is generated by scripts/bundle_native.py and git-ignored.
artifacts = ["src/gascoigne_native/lib/**"]
