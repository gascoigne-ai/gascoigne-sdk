[project]
name = "gascoigne-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["gascoigne", "integrations/*"]

[tool.uv.sources]
gascoigne = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.35",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyright>=1.1.400",
  "mcp>=1.2",
  "langchain-core>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["gascoigne/tests"]
markers = ["e2e: needs a real gascoigne binary"]
addopts = "-m 'not e2e'"
asyncio_mode = "auto"

[tool.pyright]
include = ["gascoigne/src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
