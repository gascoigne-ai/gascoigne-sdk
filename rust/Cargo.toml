[package]
name = "gascoigne"
version = "0.11.0"
edition = "2021"
description = "Embed gascoigne token optimization in agent frameworks"
license = "Apache-2.0"
repository = "https://github.com/gascoigne-ai/gascoigne-sdk"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libloading = { version = "0.9", optional = true }

[features]
# Run the engine in this process through libgascoigne (spec/native.md).
native = ["dep:libloading"]
